[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "propensity_model"
version = "0.1.0"
description = "End-to-End Propensity Modeling Pipeline for Customer Conversion & Retention"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Propensity Modeling Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "pyyaml>=6.0.0",
    "pyarrow>=14.0.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "optuna>=3.3.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0"
]
