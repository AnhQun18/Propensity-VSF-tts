project:
  name: "propensity-modeling"
  version: "0.1.0"
  random_seed: 42

paths:
  raw_data: "data/raw/customer_data.csv"
  train_data: "data/processed/train.csv"
  val_data: "data/processed/val.csv"
  test_data: "data/processed/test.csv"
  scored_data: "data/processed/scored_customers.csv"
  model_dir: "models"
  model_path: "models/propensity_model.joblib"
  preprocessor_path: "models/preprocessor.joblib"
  reports_dir: "reports"
  figures_dir: "reports/figures"
  metrics_dir: "reports/metrics"

schema:
  id_column: "customer_id"
  target_column: "converted"
  date_columns:
    - "signup_date"
    - "last_active_date"
  numerical_features:
    - "age"
    - "tenure_months"
    - "total_spend"
    - "transaction_count_last_30d"
    - "avg_order_value"
    - "app_sessions_last_30d"
  categorical_features:
    - "gender"
    - "acquisition_channel"
    - "loyalty_tier"
    - "preferred_category"
  drop_columns:
    - "customer_id"
    - "signup_date"
    - "last_active_date"

preprocessing:
  test_size: 0.2
  val_size: 0.1
  stratify: true
  outlier_strategy: "clip_iqr"  # clip_iqr, zscore, none
  numeric_imputation: "median"  # median, mean, constant
  categorical_imputation: "most_frequent" # most_frequent, constant
  handle_rare_categories: true
  rare_threshold: 0.01

model:
  algorithm: "lightgbm"  # lightgbm, xgboost, catboost, logistic_regression
  use_hyperparameter_tuning: false
  optuna_trials: 30
  cv_folds: 5
  eval_metric: "roc_auc" # roc_auc, pr_auc, f1
  lightgbm_params:
    objective: "binary"
    metric: "auc"
    boosting_type: "gbdt"
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
  xgboost_params:
    objective: "binary:logistic"
    eval_metric: "auc"
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1

scoring:
  default_threshold: 0.5
  num_deciles: 10
  export_probabilities: true

monitoring:
  psi_warning_threshold: 0.1
  psi_alert_threshold: 0.25
  reference_data_path: "data/processed/train.csv"
  current_data_path: "data/processed/scored_customers.csv"
